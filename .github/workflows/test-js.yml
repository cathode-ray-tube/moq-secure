name: JavaScript Tests

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

  pull_request:

permissions:
  contents: read

jobs:
  test-js:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm test
