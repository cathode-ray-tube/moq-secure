name: JavaScript Tests

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

  pull_request:

permissions:
  contents: read

jobs:
  test-js:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Update npm
        run: |
          npm install --global npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm test
