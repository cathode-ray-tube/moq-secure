name: Rust Tests

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

  pull_request:

jobs:
  test-rust:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Generate test vectors and run Rust tests
        run: npm run test-rust
