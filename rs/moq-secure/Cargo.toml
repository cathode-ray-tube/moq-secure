[package]
name = "moq-secure"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1"
thiserror = "1"
chacha20poly1305 = "0.10"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["pkcs8"] }
rand_core = "0.6"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
hex = "0.4"

[dev-dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
