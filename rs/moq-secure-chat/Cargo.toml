[package]
name = "moq-secure-chat"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
bytes = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
url = "2"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
base64 = "0.22"
hex = "0.4"
moq-net = "0.2.6"
moq-native = { version = "0.19.5" }
moq-secure = { path = "../moq-secure" }
