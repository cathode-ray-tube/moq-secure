[package]
name = "moq-secure-chat-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
clap = { version = "4", features = ["derive"] }

moq-secure-chat = { path = "../moq-secure-chat" }
moq-native = { version = "0.19.5" }
moq-net = "0.2.6"
url = "2"

ed25519-dalek = "2"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
