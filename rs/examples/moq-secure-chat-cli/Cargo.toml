[package]
name = "moq-secure-chat-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line client for secure MoQ chat"
license = "MIT OR Apache-2.0"
repository = "https://github.com/YOUR_USERNAME/YOUR_REPOSITORY"
readme = "README.md"
keywords = ["moq", "chat", "cli", "networking"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
hex = "0.4"
moq-native = "0.19.5"
moq-net = "0.2.6"
moq-secure-chat = "0.1.0"
rand = "0.8"
 thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
url = "2"
