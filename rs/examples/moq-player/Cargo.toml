[package]
name = "moq-player"
version = "0.1.2"
edition = "2021"

description = "A native desktop player for MoQ streams using Rust, GTK4, and GStreamer."
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cathode-ray-tube/moq-secure"
keywords = ["moq", "media", "quic", "gstreamer", "gtk"]
categories = ["multimedia", "gui"]

[dependencies]
gtk4 = "0.9"
glib = "0.20"
gstreamer = "0.23"

[[bin]]
name = "moq-player"
path = "src/main.rs"
