[package]
name = "moq-secure-chat"
version = "0.1.1"
edition = "2021"
description = "Secure chat functionality built on MoQ"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cathode-ray-tube/moq-secure"
readme = "README.md"
keywords = ["moq", "chat", "quic", "security"]
categories = ["network-programming"]

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
moq-net = "0.2.6"
moq-native = "0.19.5"
moq-secure = "0.1.2"
rand = "0.8"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
url = "2"

