[package]
name = "moq-secure-chat"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
bytes = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }

moq-net = "0.2.6"
moq-native = { version = "0.19.5" }

moq-secure = { path = "../../moq-secure" }
thiserror = "1"
url = "2"
